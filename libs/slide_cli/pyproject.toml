[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1", "setuptools-git-versioning==2.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages.find.include = ["slide_cli*"]
packages.find.exclude = ["tests*"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}"
dirty_template = "{tag}"
tag_filter = "v?\\d+(\\.\\d+)*.*"

[project]
name = "mara-research-cli"
dynamic = ["version"]
requires-python = ">= 3.10"
description = "MARA research assistant CLI for document QA, study artifacts, and slide workflows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE"]
dependencies = [
    "click>=8.1.7,<9",
    "platformdirs>=4.2.1,<5",
    "PyYAML>=6.0,<7",
    "python-pptx>=1.0.2,<2",
    "kotaemon",
    "ktem",
]
authors = [
    { name = "Chenghao Zhang", email = "tbczhang@liverpool.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
MARA = "slide_cli.cli:main"
MARA-cli = "slide_cli.cli:main"

[tool.uv.sources]
kotaemon = { workspace = true }
ktem = { workspace = true }

[project.urls]
Homepage = "https://github.com/262412/MARA/"
Repository = "https://github.com/262412/MARA/"
Documentation = "https://github.com/262412/MARA/#readme"
Upstream = "https://github.com/Cinnamon/kotaemon/"
