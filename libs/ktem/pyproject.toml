[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1", "setuptools-git-versioning==2.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
packages.find.exclude = ["ktem_tests*", "env*"]
packages.find.include = ["ktem*"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}"
dirty_template = "{tag}"
tag_filter = "v?\\d+(\\.\\d+)*.*"

[project]
name = "ktem"
dynamic = ["version"]
requires-python = ">= 3.10"
description = "MARA application runtime and local document QA workbench UI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE"]
dependencies = [
    "bcrypt>=5.0.0,<6",
    "click>=8.1.7,<9",
    "kotaemon",
    "platformdirs>=4.2.1,<5",
    "pluggy>=1.5.0,<2",
    "python-decouple>=3.8,<4",
    "python-pptx>=1.0.2,<2",
    "SQLAlchemy>=2.0.29,<3",
    "sqlmodel>=0.0.16,<0.1",
    "tiktoken>=0.6.0,<1",
    "gradio>=4.31.0,<5",
    "gradiologin",
    "python-multipart==0.0.12", # required for gradio, pinning to avoid yanking issues with micropip (fixed in gradio >= 5.4.0)
    "markdown>=3.6,<4",
    "nh3>=0.3.0,<0.4",
    "tzlocal>=5.0",
    "mcp>=1.0.0",
    "docx2pdf>=0.1.8,<0.2",
    "filelock>=3.19.1,<4",
]
authors = [
    { name = "Chenghao Zhang", email = "tbczhang@liverpool.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/262412/MARA/"
Repository = "https://github.com/262412/MARA/"
Documentation = "https://github.com/262412/MARA/#readme"
Upstream = "https://github.com/Cinnamon/kotaemon/"
