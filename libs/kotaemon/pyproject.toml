# build backand and build dependencies
[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2", "setuptools-git-versioning==2.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages.find.include = ["kotaemon*"]
packages.find.exclude = ["tests*", "env*"]

[tool.setuptools.package-data]
kotaemon = ["platform_support/assets/**/*"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}"
dirty_template = "{tag}"
tag_filter = "v?\\d+(\\.\\d+)*.*"

# metadata and dependencies
[project]
name = "kotaemon"
dynamic = ["version"]
requires-python = ">=3.11,<3.13"
description = "Kotaemon core library for AI development."
dependencies = [
    "azure-ai-documentintelligence",
    "beautifulsoup4>=4.14.3,<5",
    "click>=8.1.7,<9",
    "cohere>=5.3.2,<6",
    "cookiecutter>=2.6.0,<2.7",
    "fast_langdetect",
    "fastapi>=0.115.2,<1",
    "gradio==6.29.1",
    "html2text==2024.2.26",
    "langchain>=1.3.9,<2",
    "langchain-classic>=1.0.8,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-openai>=1.1.14,<2",
    "langchain-google-genai>=3.2,<5",
    "langchain-anthropic>=1.4.6,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-mistralai>=1.1.6,<2",
    "langchain-cohere>=0.6,<0.7",
    "chromadb==0.5.17",
    "openai>=2.26,<3",
    "matplotlib",
    "matplotlib-inline",
    "nltk>=3.10.3,<4",
    "openpyxl>=3.1.2,<3.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0", # https://github.com/chroma-core/chroma/issues/2571
    "pandas>=2.2.2,<2.3",
    "plotly<6.0.0",
    "PyMuPDF>=1.23,<=1.24.11",
    "pypdf==6.19.0",
    "llama-index-core==0.14.25",
    "llama-index-readers-file==0.7.0",
    "llama-index-cli==0.5.7",
    "llama-index-embeddings-openai>=0.6,<0.7",
    "llama-index-llms-openai>=0.7,<0.8",
    "llama-index-indices-managed-llama-cloud==0.12.0",
    "llama-index-readers-llama-parse==0.7.0",
    "llama-index-legacy==0.9.48.post4",
    "llama-index-vector-stores-chroma==0.6.0",
    "llama-index-vector-stores-lancedb==0.6.0",
    "pylance",
    "python-decouple", # for theflow
    "python-docx>=1.1.0,<1.2",
    "python-dotenv>=1.2.2,<2",
    "tenacity>=8.2.3,<8.3",
    "theflow>=0.8.6,<0.9.0",
    "trogon>=0.5.0,<0.6",
    "umap-learn==0.5.5",
    "tavily-python>=0.4.0",
    "pydantic==2.11.10",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE"]
authors = [
    { name = "@trducng", email = "john@cinnamon.is" },
    { name = "@lone17", email = "ian@cinnamon.is" },
    { name = "@taprosoft", email = "tadashi@cinnamon.is" },
    { name = "@cin-albert", email = "albert@cinnamon.is" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
mara-runtime = [
    "ddgs>=9,<10",
    "elasticsearch>=8.13.0,<8.14",
    "fastembed==0.8.1",
    "onnxruntime<v1.20",
    "googlesearch-python>=1.2.4,<1.3",
    "llama-index-vector-stores-milvus==1.2.0",
    "milvus-lite>=2.4.0; sys_platform != \"win32\"",
    "llama-index-vector-stores-qdrant==0.10.3",
    "mcp[cli]>=1.0.0",
    "sentence-transformers",
    "tabulate",
    "unstructured==0.27.16",
    "wikipedia>=1.4.0,<1.5",
    "voyageai>=0.3.0",
]
llama-cpp = ["llama-cpp-python<0.2.8"]
dev = [
    "black",
    "coverage",
    "flake8",
    "ipython",
    "pre-commit",
    "pytest",
    "pytest-mock",
    "sphinx",
]
adv = ["kotaemon[llama-cpp,mara-runtime]"]
all = ["kotaemon[dev,llama-cpp,mara-runtime]"]
