repos:
  - repo: local
    hooks:
      - id: codebase-hygiene
        name: codebase hygiene ratchet
        entry: python scripts/check_codebase_hygiene.py
        language: python
        types: [python]
      - id: eacl-case-integrity
        name: EACL saved case integrity
        entry: python docs/papers/eacl2027-demo/case_study/verify_case.py
        language: python
        files: ^docs/papers/eacl2027-demo/case_study/
        pass_filenames: false
      - id: eacl-followup-integrity
        name: EACL saved followup integrity
        entry: python docs/papers/eacl2027-demo/review_followup/verify_followup.py
        language: python
        files: ^docs/papers/eacl2027-demo/review_followup/
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3298ddab3c13dd77d6ce1fc0baf97691430d84b0 # v4.3.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: end-of-file-fixer
        # These imported records are bound by the saved paper manifests.
        exclude: "^(\\.playwright-cli/|docs/papers/eacl2027-demo/(source|case_study|review_followup)/)"
      - id: trailing-whitespace
        exclude: "^(\\.playwright-cli/|docs/demo_paper/acl_natbib\\.bst$|vendor/nltk/security\\.patch$|docs/papers/eacl2027-demo/(source|case_study|review_followup)/)"
      - id: mixed-line-ending
        exclude: "^(\\.playwright-cli/|docs/papers/eacl2027-demo/(source|case_study|review_followup)/)"
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=750"]
        exclude: "(^libs/ktem/ktem/assets/vendor/pdfjs/pdfjs-6\\.1\\.200-dist\\.zip$|^benchmark/tests/fixtures/qasper_golden_replay_v1\\.jsonl$)"
      - id: debug-statements
  - repo: https://github.com/ambv/black
    rev: ae2c0758c9e61a385df9700dc9c231bf54887041 # 22.3.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/pycqa/isort
    rev: e44834b7b294701f596c9118d6c370f86671a50d # 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
        language_version: python3.11
  - repo: https://github.com/pycqa/flake8
    rev: 82b698e09996cdde5d473e234681d8380810d7a2 # 4.0.1
    hooks:
      - id: flake8
        args: ["--max-line-length", "88", "--extend-ignore", "E203,E501"]
  - repo: https://github.com/myint/autoflake
    rev: d43d8a770c0f9ef2f68b368670ab882f6ca6ea03 # v1.4
    hooks:
      - id: autoflake
        args:
          [
            "--in-place",
            "--remove-unused-variables",
            "--remove-all-unused-imports",
            "--ignore-init-module-imports",
            "--exclude=tests/*",
          ]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 50c5478ed9e10bf360335449280cf2a67f4edb7a # v2.7.1
    hooks:
      - id: prettier
        types_or: [markdown, yaml]
        exclude: "(^README\\.md$|^\\.playwright-cli/|^docs/papers/eacl2027-demo/|^docs/reviewer-installation-verification-2026-09-23\\.md$)"
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 4daa14b20c0f48f472528c2b5f5bca28a18a7ce0 # v1.7.1
    hooks:
      - id: mypy
        additional_dependencies:
          &mypy_dependencies [
            types-PyYAML==6.0.12.11,
            types-requests==2.32.4.20250913,
            sqlmodel==0.0.25,
            types-Markdown==3.10.2.20260518,
            types-cachetools==7.0.0.20260518,
            types-tzlocal==5.1.0.1,
          ]
        args: ["--check-untyped-defs", "--ignore-missing-imports"]
        exclude: "(^templates/|\\.pyi$|^libs/(kotaemon|slide_cli)/tests/conftest\\.py$|^docs/papers/eacl2027-demo/(case_study|review_followup)/)"
      - id: mypy
        name: mypy archived EACL instrumentation
        additional_dependencies: *mypy_dependencies
        # The hash-bound experiment instruments model methods at runtime.
        args:
          [
            "--check-untyped-defs",
            "--ignore-missing-imports",
            "--disable-error-code=method-assign",
          ]
        files: "^docs/papers/eacl2027-demo/(case_study|review_followup)/.*\\.py$"
      - id: mypy
        name: mypy kotaemon conftest
        additional_dependencies: *mypy_dependencies
        args: ["--check-untyped-defs", "--ignore-missing-imports"]
        files: "^libs/kotaemon/tests/conftest\\.py$"
      - id: mypy
        name: mypy slide-cli conftest
        additional_dependencies: *mypy_dependencies
        args: ["--check-untyped-defs", "--ignore-missing-imports"]
        files: "^libs/slide_cli/tests/conftest\\.py$"
  - repo: https://github.com/codespell-project/codespell
    rev: ec0f41b9573937aebab66e3ca5b00d00a7b339fa # v2.2.4
    hooks:
      - id: codespell
        exclude: "((^|/)package-lock\\.json$|^docker/ollama/go\\.sum$|^vendor/nltk/(security\\.patch|base-files\\.json)$|^benchmark/tests/fixtures/qasper_golden_replay_v1\\.jsonl$|^libs/ktem/ktem_tests/fixtures/qasper_stage2_10396653_7cd22_production_input_records\\.json$|^docs/papers/eacl2027-demo/source/(acl\\.sty|acl_natbib\\.bst|references\\.bib)$)"
        additional_dependencies:
          - tomli==2.2.1
