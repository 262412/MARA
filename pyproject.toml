[build-system]
requires = ["setuptools >= 77.0", "wheel", "setuptools-git-versioning>=2.0,<3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages.find.include = []

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}"
dirty_template = "{tag}"
tag_filter = "v?\\d+(\\.\\d+)*.*"

[project]
name = "mara-app"
dynamic = ["version"]
requires-python = ">= 3.10"
description = "MARA local-first multimodal document QA workbench."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE"]
dependencies = [
    "kotaemon[mara-runtime]",
    "ktem"
]
authors = [
    { name = "Chenghao Zhang", email = "tbczhang@liverpool.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
mara = ["mara-research-cli"]
container-lite = [
    "mara-research-cli",
    "torch==2.8.0",
]
container-full = [
    "mara-research-cli",
    "torch==2.8.0",
]

[tool.uv.sources]
kotaemon = { workspace = true }
ktem = { workspace = true }
"mara-research-cli" = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
constraint-dependencies = [
    "mcp==1.12.4",
    "pyarrow==21.0.0",
    "pydantic-settings==2.13.1",
    "pywin32==311; sys_platform == 'win32'",
    "rich==14.1.0",
    "typer==0.19.2",
]

# uv workspace configuration
[tool.uv.workspace]
members = ["libs/kotaemon", "libs/ktem", "libs/slide_cli"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "black",
    "build",
    "coverage",
    "flake8",
    "ipython",
    "pre-commit",
    "pytest",
    "pytest-mock",
    "ruff",
    "sphinx",
    "twine",
]

[project.urls]
Homepage = "https://github.com/262412/MARA/"
Repository = "https://github.com/262412/MARA/"
Documentation = "https://github.com/262412/MARA/#readme"
Upstream = "https://github.com/Cinnamon/kotaemon/"

[tool.codespell]
skip = "*.js,*.css,*.map,.playwright-cli/*,docs/demo_paper/acl.sty,docs/demo_paper/acl_natbib.bst"
# `llm` abbreviation for large language models
ignore-words-list = "llm,fo,multline,asai"
quiet-level = 3
check-filenames = ""

[tool.isort]
known_first_party = ["kotaemon"]
