          $diskFullProcess.WaitForExit()
          "disk_full_exit_code=$($diskFullProcess.ExitCode)" | Add-Content $diagnostics
          if (Test-Path $diskFullStdout) {
            Get-Content $diskFullStdout | Write-Host
          }
          if (Test-Path $diskFullStderr) {
            Get-Content $diskFullStderr | Write-Host
            if (Select-String -Path $diskFullStderr -SimpleMatch $dataRoot -Quiet) {
              throw "The disk-full diagnostics exposed the Desktop data path."
            }
          }
          if ($diskFullProcess.ExitCode -ne 0) {
            Stop-Process -Id $embeddingServer.Id -Force -ErrorAction SilentlyContinue
            exit $diskFullProcess.ExitCode
          }
          node apps/desktop/scripts/run-python.mjs -m sidecar.smoke_fixture `
            --data-root $dataRoot
          $databaseLockProcess = Start-Process $executable `
            -ArgumentList "--smoke-test-gate3-database-lock" `
            -RedirectStandardOutput $databaseLockStdout `
            -RedirectStandardError $databaseLockStderr -PassThru
          $databaseLockProcess.WaitForExit()
          "database_lock_exit_code=$($databaseLockProcess.ExitCode)" | Add-Content $diagnostics
          if (Test-Path $databaseLockStdout) {
            Get-Content $databaseLockStdout | Write-Host
          }
          if (Test-Path $databaseLockStderr) {
            Get-Content $databaseLockStderr | Write-Host
            if (Select-String -Path $databaseLockStderr -SimpleMatch $dataRoot -Quiet) {
              throw "The database-lock diagnostics exposed the Desktop data path."
            }
          }
          if ($databaseLockProcess.ExitCode -ne 0) {
            Stop-Process -Id $embeddingServer.Id -Force -ErrorAction SilentlyContinue
            exit $databaseLockProcess.ExitCode
          }
          node apps/desktop/scripts/run-python.mjs -m sidecar.smoke_fixture `
            --data-root $dataRoot
          $largeFileStopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $largeFileProcess = Start-Process $executable `
            -ArgumentList "--smoke-test-gate3-large-file" `
            -RedirectStandardOutput $largeFileStdout `
            -RedirectStandardError $largeFileStderr -PassThru
          $largeFilePeakWorkingSet = 0
          while (-not $largeFileProcess.HasExited) {
            $largeFileProcess.Refresh()
            $largeFilePeakWorkingSet = [Math]::Max(
              $largeFilePeakWorkingSet,
              $largeFileProcess.WorkingSet64
            )
            Start-Sleep -Milliseconds 100
          }
          $largeFileStopwatch.Stop()
          Stop-Process -Id $embeddingServer.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $settingsServer.Id -Force -ErrorAction SilentlyContinue
          @(
            "large_file_exit_code=$($largeFileProcess.ExitCode)"
            "large_file_elapsed_ms=$($largeFileStopwatch.ElapsedMilliseconds)"
            "large_file_peak_working_set_bytes=$largeFilePeakWorkingSet"
          ) | Add-Content $diagnostics
          if (Test-Path $largeFileStdout) {
            Get-Content $largeFileStdout | Write-Host
          }
          if (Test-Path $largeFileStderr) {
            Get-Content $largeFileStderr | Write-Host
          }
          if ($largeFileProcess.ExitCode -ne 0) {
            exit $largeFileProcess.ExitCode
          }
          $afterRecords = & ".venv/Scripts/MARA.exe" docqa files --json |
