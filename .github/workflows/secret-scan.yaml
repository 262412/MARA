name: Secret Scanning

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-history:
    name: Repository and history
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full Git history with Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git /repo --config /repo/.gitleaks.toml --verbose --redact --no-banner --exit-code 1
      - name: Scan current worktree with Gitleaks
        if: ${{ always() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            dir /repo --config /repo/.gitleaks.toml --verbose --redact --no-banner --exit-code 1

  image:
    name: Built image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Full and Ollama inherit all repository content from the lite stage.
      - name: Build lite image without publishing
        run: docker build --target lite --tag "mara-secret-scan:${GITHUB_SHA}" .

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mara-secret-scan:${{ github.sha }}"
          scanners: secret
          exit-code: "1"
          format: table
          hide-progress: true
