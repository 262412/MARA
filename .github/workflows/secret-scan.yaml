name: Secret Scanning

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-history:
    name: Repository and history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  image:
    name: Built image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Full and Ollama inherit all repository content from the lite stage.
      - name: Build lite image without publishing
        run: docker build --target lite --tag "mara-secret-scan:${GITHUB_SHA}" .

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mara-secret-scan:${{ github.sha }}"
          scanners: secret
          exit-code: "1"
          format: table
          hide-progress: true
