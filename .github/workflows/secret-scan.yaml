name: Secret Scanning

on:
  pull_request:
    branches: [main, Dev]
  push:
    branches: [main, Dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-history:
    name: Repository and history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  image:
    name: Built image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Full and Ollama inherit all repository content from the lite stage.
      - name: Build lite image without publishing
        run: docker build --target lite --tag "mara-secret-scan:${GITHUB_SHA}" .

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "mara-secret-scan:${{ github.sha }}"
          scanners: secret
          exit-code: "1"
          format: table
          hide-progress: true
