name: Trusted supply-chain review

"on":
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-review:
    name: Trusted supply-chain review
    runs-on: ubuntu-24.04
    steps:
      - name: Require a current-head owner or member approval for protected files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          api = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]

          def api_pages(endpoint):
              page = 1
              records = []
              while True:
                  url = f"{api}/repos/{repository}{endpoint}?per_page=100&page={page}"
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      batch = json.load(response)
                  records.extend(batch)
                  if len(batch) < 100:
                      return records
                  page += 1

          protected_files = {
              ".dockerignore",
              ".pre-commit-config.yaml",
              "Dockerfile",
              "gitleaks.toml",
              "libs/ktem/MANIFEST.in",
              "package-lock.json",
              "constraints.txt",
              "install.ps1",
              "install.sh",
              "pyproject.toml",
              "requirements.azure.in",
              "requirements.txt",
              "trivy.yaml",
              "trivy.yml",
              "scripts/check_container_lock_parity.py",
              "scripts/generate_container_attestation.py",
              "scripts/generate_distribution_attestations.py",
              "scripts/publish_packages.py",
              "scripts/smoke_container_runtime.py",
              "scripts/sync_locked_constraints.py",
              "uv.lock",
          }
          protected_prefixes = (
              ".github/workflows/",
              "docker/",
              "scripts/check_supply_chain_",
              "scripts/supply_chain_",
          )
          files = api_pages(f"/pulls/{number}/files")
          expected_file_count = int(os.environ["CHANGED_FILES"])
          if len(files) != expected_file_count:
              sys.exit(
                  "GitHub returned an incomplete PR file list; failing closed "
                  f"({len(files)} of {expected_file_count})."
              )
          changed = sorted(
              item["filename"]
              for item in files
              if item["filename"] in protected_files
              or item["filename"].startswith(protected_prefixes)
              or item["filename"].startswith((".gitleaks", ".trivy"))
              or item["filename"].endswith(("/pyproject.toml", "/uv.lock"))
          )
          if not changed:
              print("No protected supply-chain policy files changed.")
              raise SystemExit(0)

          reviews = api_pages(f"/pulls/{number}/reviews")
          latest_by_user = {}
          for review in sorted(reviews, key=lambda item: item.get("id", 0)):
              user = review.get("user") or {}
              if user.get("login"):
                  latest_by_user[user["login"].lower()] = review

          owner = os.environ["REPOSITORY_OWNER"].lower()
          head_sha = os.environ["HEAD_SHA"]
          trusted = [
              review
              for login, review in latest_by_user.items()
              if review.get("state") == "APPROVED"
              and review.get("commit_id") == head_sha
              and (
                  login == owner
                  or review.get("author_association")
                  in {"OWNER", "MEMBER", "COLLABORATOR"}
              )
          ]
          if not trusted:
              print("Protected supply-chain files changed:")
              print("\n".join(f"- {path}" for path in changed))
              sys.exit(
                  "A repository owner, member, or invited collaborator must approve "
                  "the current PR head. "
                  "This intentional two-person control means an owner cannot approve "
                  "their own PR. Configure this workflow as a required branch-protection "
                  "check."
              )
          print("Current-head trusted approval found for protected files.")
          PY
