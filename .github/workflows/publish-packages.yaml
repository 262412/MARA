name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Publish target
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      skip_existing:
        description: Skip files that already exist on the target index
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality-gates.yaml

  publish:
    needs: quality
    # P0 release containment remains in force until P3 supply-chain gates pass.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Validate publishing credentials
        run: |
          python - <<'PY'
          import os

          repository = os.environ["TARGET_REPOSITORY"]
          token_env = {
              "testpypi": "TEST_PYPI_API_TOKEN",
              "pypi": "PYPI_API_TOKEN",
          }[repository]
          if not os.getenv(token_env, "").strip():
              raise SystemExit(f"Missing required secret: {token_env}")
          print(f"Using credentials from {token_env}")
          PY
        env:
          TARGET_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || (startsWith(github.ref, 'refs/tags/v') && 'pypi') || 'testpypi' }}

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
        run: |
          # publish in dependency order: ktem -> kotaemon -> mara-research-cli -> mara-app
          ARGS=(release --repository testpypi)
          if [ "${{ inputs.skip_existing }}" = "true" ]; then
            ARGS+=(--skip-existing)
          fi
          python scripts/publish_packages.py "${ARGS[@]}"

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi') }}
        run: |
          # publish in dependency order: ktem -> kotaemon -> mara-research-cli -> mara-app
          ARGS=(release --repository pypi)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.skip_existing }}" = "true" ]; then
              ARGS+=(--skip-existing)
            fi
          else
            ARGS+=(--skip-existing)
          fi
          python scripts/publish_packages.py "${ARGS[@]}"
