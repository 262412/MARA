name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Publish target
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      skip_existing:
        description: Skip files that already exist on the target index
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality-gates.yaml
    with:
      base_ref: main

  publish:
    needs: quality
    # P0 release containment remains in force until P3 supply-chain gates pass.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.19"
          checksum: 7035608168e106375b36d0c818d537a889c51a8625fe7f8f7cad5e62b947c368

      - name: Sync locked publishing environment
        run: uv sync --frozen --python 3.11

      - name: Download quality-gated distributions and attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distribution-supply-chain
          path: release-artifacts

      - name: Verify downloaded artifact digests
        run: |
          uv run --python 3.11 python scripts/generate_distribution_attestations.py \
            --dist-root release-artifacts/dist/supply-chain \
            --output-dir release-artifacts/distribution-evidence \
            --verify

      - name: Sign release distributions and evidence
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            release-artifacts/dist/supply-chain/**/*.whl
            release-artifacts/dist/supply-chain/**/*.tar.gz
            release-artifacts/distribution-evidence/*.json

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
        run: |
          # publish in dependency order: ktem -> kotaemon -> mara-research-cli -> mara-app
          ARGS=(upload --outdir release-artifacts/dist/supply-chain --repository testpypi --check)
          if [ "${{ inputs.skip_existing }}" = "true" ]; then
            ARGS+=(--skip-existing)
          fi
          uv run --python 3.11 python scripts/publish_packages.py "${ARGS[@]}"
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi') }}
        run: |
          # publish in dependency order: ktem -> kotaemon -> mara-research-cli -> mara-app
          ARGS=(upload --outdir release-artifacts/dist/supply-chain --repository pypi --check)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.skip_existing }}" = "true" ]; then
              ARGS+=(--skip-existing)
            fi
          else
            ARGS+=(--skip-existing)
          fi
          uv run --python 3.11 python scripts/publish_packages.py "${ARGS[@]}"
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
