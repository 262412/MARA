name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Publish target
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      skip_existing:
        description: Skip files that already exist on the target index
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality-gates.yaml
    with:
      base_ref: main

  publish:
    needs: quality
    # P0 release containment remains in force until P3 supply-chain gates pass.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0

      - name: Sync locked publishing environment
        run: uv sync --frozen --python 3.11

      - name: Validate publishing credentials
        run: |
          python - <<'PY'
          import os

          repository = os.environ["TARGET_REPOSITORY"]
          token_env = {
              "testpypi": "TEST_PYPI_API_TOKEN",
              "pypi": "PYPI_API_TOKEN",
          }[repository]
          if not os.getenv(token_env, "").strip():
              raise SystemExit(f"Missing required secret: {token_env}")
          print(f"Using credentials from {token_env}")
          PY
        env:
          TARGET_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || (startsWith(github.ref, 'refs/tags/v') && 'pypi') || 'testpypi' }}

      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
        run: |
          # publish in dependency order: ktem -> kotaemon -> mara-research-cli -> mara-app
          ARGS=(release --repository testpypi)
          if [ "${{ inputs.skip_existing }}" = "true" ]; then
            ARGS+=(--skip-existing)
          fi
          uv run --python 3.11 python scripts/publish_packages.py "${ARGS[@]}"

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi') }}
        run: |
          # publish in dependency order: ktem -> kotaemon -> mara-research-cli -> mara-app
          ARGS=(release --repository pypi)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.skip_existing }}" = "true" ]; then
              ARGS+=(--skip-existing)
            fi
          else
            ARGS+=(--skip-existing)
          fi
          uv run --python 3.11 python scripts/publish_packages.py "${ARGS[@]}"
