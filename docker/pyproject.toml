[project]
name = "mara-container-runtime"
version = "0.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mara-app",
    "mara-research-cli",
    "torch==2.8.0",
]

[tool.uv]
package = false
required-version = "==0.11.19"
build-constraint-dependencies = [
    "setuptools==80.9.0",
    "setuptools-git-versioning==2.1.0",
    "wheel==0.45.1",
]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "h2>=4.4.1",
    "mcp==1.12.4",
    "onnx>=1.22.0,<1.23; python_version < '3.13'",
    "pyarrow==21.0.0",
    "pydantic-settings==2.13.1",
    "rich==14.1.0",
    "typer==0.19.2",
]

[tool.uv.sources]
mara-app = { path = ".." }
mara-research-cli = { path = "../libs/slide_cli" }
kotaemon = { path = "../libs/kotaemon" }
ktem = { path = "../libs/ktem" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
