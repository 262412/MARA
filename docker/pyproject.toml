[project]
name = "mara-container-runtime"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mara-app",
    "mara-research-cli",
    "torch==2.8.0",
]

[tool.uv]
package = false
required-version = "==0.11.19"
build-constraint-dependencies = [
    "setuptools==80.9.0",
    "setuptools-git-versioning==2.1.0",
    "wheel==0.45.1",
]
constraint-dependencies = [
    "anyio==4.14.2",
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "filelock==3.32.7",
    "fsspec==2026.6.0",
    "h2>=4.4.1",
    "httpx2>=2.12.0",
    "mcp==1.12.4",
    "oauthlib==4.0.0",
    "onnx>=1.22.0,<1.23; python_version < '3.13'",
    "pyarrow==21.0.0",
    "pydantic-settings==2.13.1",
    "rich==14.1.0",
    "sentence-transformers==6.0.0",
    "soupsieve==2.9",
    "transformers==5.18.0",
    "typer==0.19.2",
    "urllib3==2.8.0",
    "virtualenv==21.7.13",
]

[tool.uv.sources]
mara-app = { path = ".." }
mara-research-cli = { path = "../libs/slide_cli" }
kotaemon = { path = "../libs/kotaemon" }
ktem = { path = "../libs/ktem" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
